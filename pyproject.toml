[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wechat-publish"
version = "0.3.0.0"
description = "Publish Markdown articles to a WeChat Official Account draft box"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Zhao Ning" }]
keywords = ["wechat", "markdown", "publisher", "official-account"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

[project.scripts]
wechat-publish = "push:main"

[tool.setuptools]
py-modules = ["push"]
